<!doctype html><html><head><meta charset="utf-8"><title>Mock krn planner</title>
<!-- Shaped like Zack's real debug export: #schedule.krn_main[role=region] > ... > div.krn_scrollable > div > div.krn_matrix,
     a hover box div.krn_shadow (one day x one row, 42 px high, rows 43 px apart), <time> day headers 246 px wide starting at x=173,
     names in a SEPARATE left pane (173 px) that scrolls along with the matrix, words split over tags, group header rows. -->
<style>body{font:12px sans-serif;margin:0;overflow:hidden}#bar{background:#0b5560;color:#fff;padding:8px;height:40px;box-sizing:border-box}
#tools{height:30px;text-align:right;padding:4px}#schedule{position:relative}
.hdr{display:flex;height:40px}.corner{width:173px;flex:none;padding-top:14px;font-weight:600}
.hdr time{display:block;width:246px;flex:none;border-left:1px solid #ddd;text-align:center;padding-top:6px;box-sizing:border-box}
.body{display:flex}.names{width:173px;flex:none;height:512px;overflow:hidden}
.nrow{height:43px;box-sizing:border-box;border-bottom:1px solid #eee;display:flex;align-items:center;gap:4px}
.nrow .hrs{color:#888;font-size:10px;margin-left:auto;padding-right:4px}.grp{height:43px;background:#f3f3f3;font-weight:bold;line-height:43px;padding-left:4px}
.krn_scrollable{height:512px;overflow:auto;flex:1}.krn_matrix{position:relative;width:1722px;
background:repeating-linear-gradient(#fff 0 42px,#eee 42px 43px)}
.krn_shadow{position:absolute;width:246px;height:42px;background:#d8ecff88;display:none}
.b{position:absolute;height:22px;background:#8a4fd1;color:#fff;font-size:9px;overflow:hidden;white-space:nowrap;z-index:2}
#panel{position:fixed;right:0;top:0;bottom:0;width:330px;background:#fff;border-left:2px solid #333;visibility:hidden}
#panel.open{visibility:visible}.f span{display:block;font-size:10px}#err{color:red}</style></head>
<body><div id="bar">UKG Schedule Planner</div><div id="tools"><button id="tsave">Save</button></div>
<div id="schedule" class="krn_main" role="region" aria-label="scheduler">
 <div class="hdr"><div class="corner">Name</div><div id="days" style="display:flex"></div></div>
 <div class="body"><div class="names"><div id="nin"></div></div>
  <div class="krn_scrollable" id="sc"><div><div class="krn_matrix" id="mx"><div class="krn_shadow" id="sh"></div></div></div></div></div>
</div>
<div id="panel"><iframe id="pf" style="width:100%;height:100%;border:0"></iframe></div>
<script>
const DAYS = [["Mon","10/05"],["Tue","10/06"],["Wed","10/07"],["Thu","10/08"],["Fri","10/09"],["Sat","10/10"],["Sun","10/11"]], RH = 43, DW = 246;
window.added = []; window.pending = []; window.DIRECTORY = window.DIRECTORY || []; window.PRIMARY = window.PRIMARY || {};
DAYS.forEach(([d, md]) => { const t = document.createElement('time'); t.textContent = `${d} ${md}`; days.appendChild(t); });
let rows = [], cur = null;
window.render = () => {
  const ns = [...new Set([...DIRECTORY, 'Aaron, Filler', 'Zed, Filler'])].sort();
  const half = Math.ceil(ns.length / 2);
  rows = [{ g: 'FRONT OF HOUSE' }, ...ns.slice(0, half).map((n) => ({ n })), { g: 'BAR' }, ...ns.slice(half).map((n) => ({ n }))];
  nin.innerHTML = rows.map((r) => r.g ? `<div class="grp">${r.g}</div>` : (() => { const [l, f] = r.n.split(', '); return `<div class="nrow"><input type="checkbox"><span class="krn_name">${l}, <span>${f}</span></span><i></i><span class="hrs">32.00</span></div>`; })()).join('');
  mx.style.height = rows.length * RH + 'px';
  draw();
};
sc.addEventListener('scroll', () => { document.querySelector('.names').scrollTop = sc.scrollTop; });
const cellAt = (e) => { const r = mx.getBoundingClientRect(); const ri = Math.floor((e.clientY - r.top) / RH), di = Math.floor((e.clientX - r.left) / DW); return rows[ri] && rows[ri].n && di >= 0 && di < 7 ? { ri, di } : null; };
mx.addEventListener('mousemove', (e) => { const c = cellAt(e); if (!c) return; sh.style.display = 'block'; sh.style.top = c.ri * RH + 'px'; sh.style.left = c.di * DW + 'px'; });
mx.addEventListener('click', (e) => { if (e.target !== mx && e.target !== sh) return; const c = cellAt(e); if (c) open(rows[c.ri].n, DAYS[c.di][1]); });
let opens = 0;
// like real Kronos (slow, changing ids, labels that differ): the panel shows up late inside an iframe;
// each opening rotates how the time boxes are labelled
function open(n, md) {
  opens++; const v = opens % 3, k = opens;
  cur = n; panel.dataset.md = md; panel.classList.remove('open'); pf.srcdoc = '';
  const st = v === 1 ? `<label for="st_${k}">Start time</label><input id="st_${k}" class="t-st">` : v === 2 ? `<span>START TIME:</span><input id="st_${k}" class="t-st">` : `<input id="st_${k}" class="t-st" placeholder="hh:mm">`;
  const en = v === 1 ? `<label for="en_${k}">End time</label><input id="en_${k}" class="t-en">` : v === 2 ? `<input id="en_${k}" class="t-en"><span>End Time</span>` : `<input id="en_${k}" class="t-en" placeholder="hh:mm">`;
  const apply = window.RENAME_APPLY ? `<button id="ok_${k}" class="t-apply">OK</button>` : `<button id="ap_${k}" class="t-apply">Apply</button>`;
  const html = `<style>body{font:12px sans-serif}div{margin:4px 0}</style><div class="krn-panel"><b>Add Shift</b><div>${n}</div>
    <div>Regular [1.00]</div><div>${st}</div><div>${en}</div><div>${md}</div>
    <div>Job: <span id="job">${PRIMARY[n] || '--'}</span> ${window.HIDE_JOB ? '' : '<span id="xfer" style="color:#06c;cursor:pointer">Transfer Employee</span>'}<div id="jobmenu" hidden></div></div>
    <div id="err" style="color:red"></div><button id="cn_${k}" class="t-cancel">Cancel</button> ${apply}</div>
    <script>
      const P = parent, q = (c) => document.querySelector(c);
      q('.t-st').value = '7:00 AM'; q('.t-en').value = '8:00 AM';
      if (q('#xfer')) q('#xfer').onclick = () => { const m = q('#jobmenu'); m.innerHTML = ''; ['Server','Bar','Bus','Host','Manager'].forEach((j) => { const d = document.createElement('div'); d.setAttribute('role','menuitem'); d.textContent = j; d.onclick = () => { q('#job').textContent = j; m.hidden = true; }; m.appendChild(d); }); m.hidden = false; };
      q('.t-cancel').onclick = () => P.closePanel();
      q('.t-apply').onclick = () => { const e = P.applyShift(q('.t-st').value, q('.t-en').value, q('#job').textContent); if (e) q('#err').textContent = e; };
    <\/script>`;
  setTimeout(() => { pf.srcdoc = html; panel.classList.add('open'); }, 1500 + Math.random() * 1000);
}
window.closePanel = () => { panel.classList.remove('open'); pf.srcdoc = ''; };
window.applyShift = (a, b, j) => { if (!T.test(a) || !T.test(b)) return 'Bad time'; if (j === '--') return 'No job';
  pending.push({ name: cur, date: panel.dataset.md + '/2026', start: a, end: b, job: j }); closePanel(); draw(); };
function draw() {
  mx.querySelectorAll('.b').forEach((b) => b.remove());
  for (const s of [...added, ...pending]) {
    const ri = rows.findIndex((r) => r.n === s.name), di = DAYS.findIndex((d) => d[1] === s.date.slice(0, 5));
    const [h, m, ap] = s.start.match(/(\d+):(\d+) (AM|PM)/).slice(1); const min = (h % 12 + (ap === 'PM' ? 12 : 0)) * 60 + +m;
    const b = document.createElement('div'); b.className = 'b'; b.textContent = s.start + ' - ' + s.end; b.style.top = ri * RH + 10 + 'px'; b.style.left = di * DW + min / 1440 * DW + 'px'; b.style.width = '60px';
    b.onclick = (e) => e.stopPropagation(); mx.appendChild(b);
  }
}
const T = /^(1[0-2]|[1-9]):[0-5]\d (AM|PM)$/;
tsave.onclick = () => { added.push(...pending); pending = []; draw(); };
// for the test: scroll to a person and give the point of their empty spot on a day (~7 AM)
window.spot = (n, md) => { const ri = rows.findIndex((r) => r.n === n), di = DAYS.findIndex((d) => d[1] === md); sc.scrollTop = ri * RH - 200; const r = mx.getBoundingClientRect(); return [r.left + di * DW + DW * 0.3, r.top + ri * RH + 21]; };
</script></body></html>
