<!doctype html><html><head><meta charset="utf-8"><style>body{font:13px sans-serif;padding:8px}label{display:block;margin:6px 0}li{cursor:pointer;padding:2px}li:hover{background:#eee}#err{color:red}</style></head><body>
<b>Add shift</b>
<label>Employee <input id="emp" aria-label="Employee search"></label><ul id="list" role="listbox"></ul>
<label for="date">Date</label><input id="date" placeholder="MM/DD/YYYY">
<label>Start time <input id="st" aria-label="Start time"></label>
<label>End time <input id="en" aria-label="End time"></label>
<label>Job <select id="job" aria-label="Job"><option value="">--</option><option>Server</option><option>Bar</option><option>Bus</option><option>Host</option><option>Manager</option></select></label>
<div id="err"></div><button id="save">Save</button> <button id="cancel">Cancel</button>
<script>
let picked = null;
const dir = parent.DIRECTORY;
emp.addEventListener('input', () => { list.innerHTML=''; picked=null; const q = emp.value.toLowerCase(); if (q.length<2) return;
  dir.filter(n => n.toLowerCase().includes(q)).slice(0,6).forEach(n => { const li=document.createElement('li'); li.setAttribute('role','option'); li.textContent=n; li.onclick=()=>{picked=n; emp.value=n; list.innerHTML='';}; list.appendChild(li); }); });
const T = /^(1[0-2]|[1-9]):[0-5]\d (AM|PM)$/, D = /^\d\d\/\d\d\/\d{4}$/;
save.onclick = () => {
  if (!picked) return err.textContent='Pick an employee';
  if (!D.test(date.value)) return err.textContent='Bad date';
  if (!T.test(st.value) || !T.test(en.value)) return err.textContent='Bad time';
  if (!job.value) return err.textContent='Pick a job';
  parent.saveShift({name:picked, date:date.value, start:st.value, end:en.value, job:job.value});
};
cancel.onclick = () => parent.document.getElementById('dlg').style.display='none';
</script></body></html>
