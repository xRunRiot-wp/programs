<!doctype html><html><head><meta charset="utf-8"><title>Mock Schedule Planner</title>
<style>body{font:13px sans-serif;margin:0}#bar{background:#0b4f5c;color:#fff;padding:8px}table{border-collapse:collapse;margin:8px}td,th{border:1px solid #ccc;width:110px;height:28px;vertical-align:top;font-size:11px}
.shift{background:#8a4fd1;color:#fff;margin:1px;padding:1px 3px;border-radius:3px}#dlg{position:fixed;left:200px;top:80px;width:420px;height:440px;border:2px solid #333;background:#fff;display:none}</style></head>
<body><div id="bar">Mock Schedule Planner <button id="quick" aria-label="Add shift">Add shift</button></div>
<table id="grid"><thead><tr><th>Name</th><th>Mon 10/05</th><th>Tue 10/06</th><th>Wed 10/07</th><th>Thu 10/08</th><th>Fri 10/09</th><th>Sat 10/10</th><th>Sun 10/11</th></tr></thead><tbody></tbody></table>
<iframe id="dlg" src="about:blank"></iframe>
<script>
window.added = []; window.DIRECTORY = window.DIRECTORY || [];
const cols = {"10/05":1,"10/06":2,"10/07":3,"10/08":4,"10/09":5,"10/10":6,"10/11":7};
document.getElementById('quick').onclick = () => { const f = document.getElementById('dlg'); f.src = 'dialog/add.html?' + Date.now(); f.style.display = 'block'; };
window.saveShift = (s) => {
  window.added.push(s);
  let row = [...document.querySelectorAll('#grid tbody tr')].find(r => r.cells[0].textContent === s.name);
  if (!row) { row = document.querySelector('#grid tbody').insertRow(); for (let i = 0; i < 8; i++) row.insertCell(); row.cells[0].textContent = s.name; }
  const md = s.date.slice(0,5);
  const d = document.createElement('div'); d.className = 'shift'; d.textContent = s.start + ' - ' + s.end; row.cells[cols[md]].appendChild(d);
  document.getElementById('dlg').style.display = 'none';
};
</script></body></html>
